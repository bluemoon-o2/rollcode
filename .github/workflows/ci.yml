name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck/test/build/smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: CLI smoke tests
        run: |
          ./rollcode.js --help
          ./rollcode.js --version
          ./rollcode.js info

      - name: Package smoke test
        run: npm pack --dry-run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TS files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi

          FILES=$(git diff --name-only --diff-filter=ACMRT "$RANGE" | grep -E '^(src|test)/.*\.(ts|tsx)$' || true)

          if [ -z "$FILES" ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$FILES"
          printf '%s\n' "$FILES" | xargs -r bunx --bun @biomejs/biome@2.2.5 check
